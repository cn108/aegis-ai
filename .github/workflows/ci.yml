name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate deterministic synthetic dataset
        run: python -m scripts.generate_logs

      - name: Train model and evaluate held-out data
        run: python -m scripts.train_model

      - name: Run tests and Django checks
        run: |
          python -m unittest api.tests -v
          python manage.py check
